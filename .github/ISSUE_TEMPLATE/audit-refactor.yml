name: Code Audit / Refactor
description: Problema de calidad, seguridad o claridad detectado en auditoría
labels: ["audit"]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Code Audit / Refactor
        Usá esta template para reportar problemas de calidad, seguridad o claridad encontrados durante la auditoría del código.

  - type: dropdown
    id: category
    attributes:
      label: Categoría
      description: Tipo de problema detectado
      options:
        - Seguridad — vulnerabilidad o exposición de datos sensibles
        - Robustez — falta de validación o manejo de errores deficiente
        - Recursos — leak de conexiones, streams o memoria
        - Claridad — código confuso, sin comentarios ohard to follow
        - Diseño — estructura mejorable, acoplamiento, responsabilidade mal asignada
        - Consistencia — comportamiento inconsistente o convenciones no respetadas
    validations:
      required: true

  - type: textarea
    id: finding
    attributes:
      label: Hallazgo
      description: Qué se encontró y por qué es un problema
      placeholder: |
        En Protocolo.java:149 se llama Date.valueOf(partes[3]) sin validar el formato.
        Si el cliente envía una fecha inválida, se lanza IllegalArgumentException que
        se captura como E99 genérico en vez de dar un mensaje claro al cliente.
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Ubicación
      description: Clase y método donde está el problema
      placeholder: Ej: Protocolo.java:149 (parseTimestamp)
    validations:
      required: true

  - type: textarea
    id: proposed-fix
    attributes:
      label: Solución propuesta
      description: Qué cambio específico resolvería el problema
      placeholder: Agregar validación de formato con regex antes de llamar a Date.valueOf()
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      description: Qué tan urgente es resolver esto antes de agregar concurrencia
      options:
        - Alta — puede causar pérdida de datos o crasheo
        - Media — afecta calidad o seguridad de forma no crítica
        - Baja — mejora deseable pero no bloqueante
    validations:
      required: true
