name: Bug Report
description: Algo no funciona como debería
labels: ["bug"]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Completá los campos para reportar un problema. Cuanta más info, más rápido se resuelve.

  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Qué pasa y qué debería pasar
      placeholder: Ej: Al registrar un tripulante con fecha vacía, el servidor crashea en vez de devolver un error de validación.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Instrucciones paso a paso para provocar el bug
      placeholder: |
        1. Conectarse al servidor con nc localhost 9000
        2. Enviar LOGIN|admin|admin123
        3. Enviar REGISTRAR_TRIPULANTE|token|F|2025-01-01|80|175|Juan|Perez|img.jpg
        4. Ver error en consola del servidor
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Qué debería haber pasado
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log / salida del servidor
      description: Pegá acá la salida relevante de la consola o del cliente
      render: shell
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severidad
      description: Qué tan grave es el bug
      options:
        - Crítico — bloquea funcionalidad core
        - Medio — hay workaround pero debería funcionar
        - Bajo — edge case o cosmético
    validations:
      required: true

  - type: input
    id: affected-class
    attributes:
      label: Clase/método afectado
      description: Si sabés dónde está el problema, indicá la clase y método
      placeholder: Ej: Protocolo.procesar() línea 149
    validations:
      required: false
